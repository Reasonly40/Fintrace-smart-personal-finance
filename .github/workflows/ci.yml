name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fintrace_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d fintrace_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      # Nilai khusus CI, bukan rahasia. Jangan pernah menaruh rahasia asli di file ini.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/fintrace_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/fintrace_ci_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -v